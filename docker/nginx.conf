# Configuration nginx du conteneur du portfolio.
# nginx sert les fichiers statiques et délègue le PHP à php-fpm, qui tourne dans
# le même conteneur. Le reverse proxy du serveur route simplement vers le port
# 8080 exposé ici.

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # nginx tourne sous www-data : tous les fichiers temporaires vont dans /tmp,
    # le seul emplacement inscriptible du conteneur.
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml;

    # Le TLS est terminé par le reverse proxy en amont : sans cette bascule, les
    # URLs canoniques et Open Graph générées par assets/partials/seo.php
    # repartiraient en http://.
    map $http_x_forwarded_proto $fastcgi_https {
        default '';
        https   'on';
    }

    server {
        listen 8080;
        server_name _;

        root /var/www/html;
        index index.php index.html;

        # Sonde utilisée par le HEALTHCHECK de l'image et par docker compose.
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location / {
            try_files $uri $uri/ =404;
        }

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTPS $fastcgi_https if_not_empty;
        }

        location ~ /\.ht {
            deny all;
        }

        # Fragments inclus par les pages : jamais servis directement.
        location ^~ /assets/partials/ {
            return 404;
        }

        # Les assets sont versionnés avec l'image : on peut les mettre en cache long.
        location ~* \.(css|js|jpe?g|png|svg|webp|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }
}
