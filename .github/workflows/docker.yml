name: Image Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: registry.selutech.fr
  IMAGE_NAME: jules-ferlin

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Syntaxe PHP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `php -l` sur chaque fichier : le site est du PHP simple, sans dépendances
      # Composer, donc il n'y a rien de plus à installer.
      - name: Vérifier la syntaxe des fichiers PHP
        run: |
          docker run --rm -v "$PWD/src":/src -w /src php:8.3-cli \
            sh -c 'find . -name "*.php" -print0 | xargs -0 -n1 php -l'

  build:
    name: Construire et publier
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Sur une pull request on construit sans publier : pas besoin des secrets,
      # qui ne sont de toute façon pas exposés aux forks.
      - name: Se connecter au registre
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.SELUTECH_REGISTRY_USER }}
          password: ${{ secrets.SELUTECH_REGISTRY_TOKEN }}

      - name: Calculer les tags et labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=Portfolio de Jules Ferlin
            org.opencontainers.image.description=Site portfolio de Jules Ferlin (nginx + php-fpm)

      - name: Construire et publier l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Récapitulatif
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Image publiée"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
