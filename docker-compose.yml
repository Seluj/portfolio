# Déploiement : le conteneur sert le portfolio sur son port 8080, et le nginx
# du serveur (qui répartit les requêtes entre les différentes applications)
# proxifie vers le port publié ci-dessous.
#
#   docker compose pull && docker compose up -d
#
# Pour développer en local avec le code monté en direct :
#   docker compose -f docker-compose.dev.yml up

services:
  portfolio:
    image: registry.selutech.fr/jules-ferlin:latest
    container_name: jules-ferlin-portfolio
    restart: unless-stopped
    ports:
      # Si le reverse proxy tourne sur la même machine (hors Docker), restreindre
      # la publication à la boucle locale : "127.0.0.1:8091:8080".
      - "127.0.0.1:8091:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# Si le reverse proxy est lui-même un conteneur, le plus simple est de le
# rejoindre sur un réseau partagé et de supprimer la section `ports` ci-dessus :
# il atteindra alors le site sur http://portfolio:8080.
#
# networks:
#   default:
#     name: reverse-proxy
#     external: true
